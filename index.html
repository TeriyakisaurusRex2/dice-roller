// =====================================================================
//  HANDS-ON PLAY — shake & throw with the mouse, click a home die,
//  hover tooltips, watching others shake, emotes, volume
// =====================================================================
const cv = renderer.domElement;
cv.style.touchAction = 'none';   // so dragging on a phone shakes dice instead of scrolling
const raycaster = new THREE.Raycaster(), pointerNDC = new THREE.Vector2();
const HAND_Y = 3.2;                                            // held dice float at this height
const handPlane = new THREE.Plane(UP.clone(), -HAND_Y);
function setPointer(e) {
  const r = cv.getBoundingClientRect();
  pointerNDC.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointerNDC, camera);
}
// Where the cursor points at hand height, kept over the table
function handPoint() {
  const p = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(handPlane, p)) return null;
  const r = Math.hypot(p.x, p.z);
  if (r > 5.5) { p.x *= 5.5 / r; p.z *= 5.5 / r; }
  return p;
}

// ---------- Hand styles: how held dice move while you shake ----------
// Each style's offset(i, n, h) says where die i of n sits relative to the hand point right now.
// h.time = seconds since pickup, h.phase = an angle that runs faster the harder you shake, h.energy = shake strength (0 – 1.6).
// speed / speedGain set how fast h.phase turns; spin(e) = how fast each die tumbles.
const TAU = Math.PI * 2;
const _he = new THREE.Euler(), _hq = new THREE.Quaternion();
const jitter = j => new THREE.Vector3(rand(-j, j), rand(-j, j), rand(-j, j));
const HAND_STYLES = {
  handful: {
    name: 'Handful', speed: 0, speedGain: 0, spin: e => 0.8 + e * 12,
    // A loose sunflower-spiral clump that jiggles harder as you shake
    offset: (i, n, h) => new THREE.Vector3(Math.cos(i * 2.4) * 0.6 * Math.sqrt(i + 0.4), (i % 2) * 0.5 - 0.25, Math.sin(i * 2.4) * 0.6 * Math.sqrt(i + 0.4))
      .add(jitter(0.06 + h.energy * 0.2)),
  },
  ring: {
    name: 'Rune ring', speed: 1.4, speedGain: 7, spin: e => 1.5 + e * 6,
    // Dice evenly spaced on a circle, the circle tilted and slowly wobbling; shaking spins it faster
    offset: (i, n, h) => {
      const r = Math.max(1.15, n * 0.2), a = i / n * TAU + h.phase;
      _hq.setFromEuler(_he.set(0.6 + Math.sin(h.time * 0.8) * 0.15, 0, 0.35 + Math.cos(h.time * 0.6) * 0.12));
      return new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r).applyQuaternion(_hq).add(jitter(h.energy * 0.05));
    },
  },
  implode: {
    name: 'Implosion', speed: 3, speedGain: 10, spin: e => 3 + e * 16,
    // Crushed into a tight ball that breathes; shaking makes it throb outward and quake
    offset: (i, n, h) => {
      const y = 1 - (i + 0.5) / n * 2, rr = Math.sqrt(1 - y * y), a = i * 2.4;   // spread evenly over a sphere
      const size = 0.38 + Math.sin(h.time * 4) * 0.06 + h.energy * 0.35 * Math.abs(Math.sin(h.phase * 2));
      return new THREE.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr).multiplyScalar(size).add(jitter(0.03 + h.energy * 0.28));
    },
  },
  vortex: {
    name: 'Vortex', speed: 2.2, speedGain: 9, spin: e => 2 + e * 8,
    // A spinning cone: narrow at the bottom, wide at the top, like a little whirlwind
    offset: (i, n, h) => {
      const f = n > 1 ? i / (n - 1) : 0.5, a = h.phase + i * 1.1, r = 0.3 + f * (1 + h.energy * 0.3);
      return new THREE.Vector3(Math.cos(a) * r, (f - 0.5) * 2.4 + Math.sin(h.time * 3 + i) * 0.1, Math.sin(a) * r);
    },
  },
  atom: {
    name: 'Atom', speed: 2.5, speedGain: 9, spin: e => 1 + e * 8,
    // One die sits in the middle as the nucleus; the rest fly around it on three differently tilted orbits.
    // All orbits turn at the same speed but start a third of a lap apart, so they never bunch up.
    offset: (i, n, h) => {
      if (i === 0 || n < 3) return jitter(0.04 + h.energy * 0.12);
      const j = i - 1, orbit = j % 3, k = Math.floor(j / 3), per = Math.ceil((n - 1) / 3);
      const a = h.phase + k / per * TAU + orbit * TAU / 3 / per;
      _hq.setFromEuler(_he.set(0.5 + orbit * 0.55, orbit * TAU / 3, orbit * 0.4));
      return new THREE.Vector3(Math.cos(a) * 1.6, 0, Math.sin(a) * 1.6).applyQuaternion(_hq);
    },
  },
  swarm: {
    name: 'Swarm', speed: 1, speedGain: 5, spin: e => 2 + e * 10,
    // Each die buzzes on its own looping path, like bees; shaking makes the swarm wilder
    offset: (i, n, h) => {
      const p = h.phase, s = 1 + h.energy * 0.4;
      return new THREE.Vector3(Math.sin(p * (0.9 + i * 0.13) + i) * 1.7 * s, Math.sin(p * (1.3 + i * 0.07) + i * 2) * 0.8, Math.cos(p * (1.1 + i * 0.11) + i * 3) * 1.7 * s);
    },
  },
};
const HAND_KEYS = Object.keys(HAND_STYLES);

// A "hand": the dice you're holding, floating at a point and moving in the player's hand style.
// Used for your own shake, and to show other players' shakes live.
// On creation it gathers the dice: ones lying on the table fly up into it one after another;
// if the table is empty (first throw of a turn) they rise out of the player's bank instead.
class Hand {
  constructor(n, diceStyle, handStyle, at, quiet = false) {
    this.hs = HAND_STYLES[handStyle] || HAND_STYLES.handful;
    this.pos = at.clone(); this.target = at.clone();
    this.energy = 0; this.time = 0; this.phase = 0; this.nextRattle = 0; this.quiet = quiet;
    this.release = null;   // set when thrown: dice line up where the physics will start them
    const sources = tableDice.filter(d => !d.gone && !d.spent);
    const bank = banks[view?.turnIdx]?.pile.pos ?? new THREE.Vector3();
    const now = performance.now();
    this.dice = Array.from({ length: n }, (_, i) => {
      let d = sources[i];
      if (d) {
        tableDice.splice(tableDice.indexOf(d), 1);   // the hand owns it now
        removeHomeHint(d);
        d.fromTable = true; d.homePos = d.mesh.position.clone(); d.homeQuat = d.mesh.quaternion.clone();
        d.mats.forEach(m => { m.emissive.set(0x000000); m.color.set('#ffffff'); });
        if (d.halo) { scene.remove(d.halo); d.halo = null; }
      } else {
        d = makeDie(diceStyle);
        d.mesh.position.copy(bank).setY(0.4).add(new THREE.Vector3(rand(-0.4, 0.4), 0, rand(-0.4, 0.4)));
        d.mesh.scale.setScalar(0.01); d.grow = true;   // pops into existence as it leaves the bank
      }
      d.gather = { from: d.mesh.position.clone(), t0: now + i * 70, dur: 520 };   // staggered: one die after another
      return d;
    });
    this.spinAxes = this.dice.map(() => new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize());
    SFX.whoosh(quiet);
  }
  get gathered() { return this.dice.every(d => !d.gather); }
  update(dt, now) {
    this.time += dt;
    this.pos.lerp(this.target, 1 - Math.exp(-dt * 18));                 // glide toward the cursor
    this.energy = Math.max(0, this.energy - dt * 1.4);                   // shaking calms down when the mouse stops
    this.phase += dt * (this.hs.speed + this.energy * this.hs.speedGain);
    const n = this.dice.length;
    this.dice.forEach((d, i) => {
      const goal = this.release ? this.release[i] : this.pos.clone().add(this.hs.offset(i, n, this));
      const g = d.gather;
      if (g) {
        // Gathering: arc from where the die was up into its place in the hand
        const k = THREE.MathUtils.clamp((now - g.t0) / g.dur, 0, 1);
        if (k <= 0) return;
        d.mesh.position.lerpVectors(g.from, goal, ease(k));
        d.mesh.position.y += Math.sin(k * Math.PI) * 1.2;
        if (d.grow) d.mesh.scale.setScalar(Math.max(0.01, ease(k)));
        if (k >= 1) { d.gather = null; d.mesh.scale.setScalar(1); }
      } else {
        // Held: follow the style's formation (snappier while lining up for the throw)
        d.mesh.position.lerp(goal, 1 - Math.exp(-dt * (this.release ? 25 : 16)));
      }
      d.mesh.rotateOnAxis(this.spinAxes[i], dt * this.hs.spin(this.energy));
    });
    // Rattle: more energy = louder and more frequent clacks (only once the dice are all in hand)
    if (this.gathered && this.energy > 0.12 && now > this.nextRattle) {
      SFX.clack((2 + this.energy * 7) * (this.quiet ? 0.5 : 1));
      this.nextRattle = now + rand(40, 120) / Math.min(1.6, this.energy + 0.3);
    }
  }
  // Thrown: dice snap into the throwing formation that the physics will start from
  letGo(aimArg) { const aim = aimFromHand(aimArg); this.release = this.dice.map((_, i) => spawnSlot(i, aim)); }
  // Called off without a throw: table dice drop back where they were, dice from the bank fade away
  cancel() {
    for (const d of this.dice) {
      if (!d.fromTable) { disposeDie(d); continue; }
      const from = d.mesh.position.clone(), q0 = d.mesh.quaternion.clone();
      tableDice.push(d);
      animate(400, t => { d.mesh.position.lerpVectors(from, d.homePos, ease(t)); d.mesh.quaternion.slerpQuaternions(q0, d.homeQuat, ease(t)); });
    }
    this.dice = [];
  }
  dispose() { this.dice.forEach(disposeDie); this.dice = []; }
}

let myHand = null, handHistory = [], awaitingThrow = null, lastShakeSent = 0;
const remoteHands = new Map();   // player id -> Hand, for other people's live shakes

function canThrowNow() {
  const v = view;
  return !!(v?.turn && (v.phase === 'ready' || v.phase === 'decide') && iControl(v) && throwable(v.turn) > 0 && !busy && !playback && !awaitingThrow);
}
function canSpendHome() {
  const v = view;
  return !!(v?.turn && v.phase === 'decide' && iControl(v) && v.turn.homesLeft > 0 && v.turn.unbanked > 0 && !busy && !myHand);
}
function clearHands() {
  myHand?.dispose(); myHand = null;
  clearTimeout(awaitingThrow); awaitingThrow = null;
  remoteHands.forEach(h => h.dispose()); remoteHands.clear();
}

// Tell everyone where my hand is (throttled to ~15 updates a second; always send the "let go" message)
function sendShake(on) {
  const now = performance.now();
  if (on && now - lastShakeSent < 66) return;
  lastShakeSent = now;
  const arg = { on, x: myHand?.pos.x ?? 0, z: myHand?.pos.z ?? 0, e: myHand?.energy ?? 0 };
  if (isHost) relayShake(myId, arg);
  else if (hostConn?.open) hostConn.send({ t: 'act', a: 'shake', arg });
}
// Host: pass a shake on to every other screen (and show it here if it came from a client)
function relayShake(from, arg) {
  const p = S?.turn && curPlayer(S);
  if (!p || !(p.owner === from || (from === myId && !ownerOnline(p.owner)))) return;
  const msg = { t: 'shake', pid: p.id, n: throwable(S.turn), style: p.style, hs: p.hand, on: !!arg?.on, x: +arg?.x || 0, z: +arg?.z || 0, e: +arg?.e || 0 };
  for (const [id, c] of conns) if (id !== from && c.open) c.send(msg);
  if (from !== myId) onShake(msg);
}
// Everyone: show (or remove) someone else's shaking hand
function onShake(m) {
  if (busy || playback) return;   // a throw is already playing; ignore stragglers
  let h = remoteHands.get(m.pid);
  if (!m.on) { h?.cancel(); remoteHands.delete(m.pid); return; }
  if (!h) { h = new Hand(m.n, m.style, m.hs, new THREE.Vector3(m.x, HAND_Y, m.z), true); remoteHands.set(m.pid, h); }
  h.target.set(m.x, HAND_Y, m.z);
  h.energy = Math.max(h.energy, m.e);
}

// ---------- Pointer: shake, throw, click a home die ----------
cv.addEventListener('pointerdown', e => {
  audio(); setPointer(e);
  const die = pickDie();
  if (die?.face === 'home' && !die.spent && canSpendHome()) { hideTip(); act('home'); return; }   // click a glowing home die to bank
  if (!canThrowNow()) return;
  const p = handPoint();
  if (!p) return;
  try { cv.setPointerCapture(e.pointerId); } catch {}   // keep getting moves even if the cursor leaves the canvas
  hideTip();
  myHand = new Hand(throwable(view.turn), curStyle(), curPlayer(view).hand, p);
  handHistory = [{ t: performance.now(), p }];
  cv.style.cursor = 'grabbing';
  sendShake(true);
});
cv.addEventListener('pointermove', e => {
  setPointer(e);
  if (!myHand) return hover(e);
  const p = handPoint();
  if (!p) return;
  const now = performance.now(), last = handHistory.at(-1);
  myHand.energy = Math.min(1.6, myHand.energy + p.distanceTo(last.p) * 0.35);   // faster movement = more shake
  myHand.target.copy(p);
  handHistory.push({ t: now, p });
  while (handHistory.length > 2 && now - handHistory[0].t > 250) handHistory.shift();
  sendShake(true);
});
cv.addEventListener('pointerup', () => {
  if (!myHand) return;
  // Throw velocity = how far the hand moved over roughly the last 0.1 s
  const now = performance.now(), end = handHistory.at(-1);
  const start = handHistory.find(h => now - h.t <= 120) || handHistory[0];
  const dt = Math.max((end.t - start.t) / 1000, 0.016);
  const vx = (end.p.x - start.p.x) / dt, vz = (end.p.z - start.p.z) / dt;
  const release = { x: myHand.pos.x, z: myHand.pos.z, vx, vz };
  myHand.letGo(release);   // dice snap into the throwing formation...
  cv.style.cursor = '';
  // Keep the hand visible until the roll arrives (the roll clears it); give up after a few seconds if it never does
  awaitingThrow = setTimeout(() => { myHand?.cancel(); myHand = null; awaitingThrow = null; sendShake(false); }, 5000);
  setTimeout(() => act('throw', release), 160);   // ...and get a beat to do it before the throw starts
});
cv.addEventListener('pointercancel', () => { if (myHand && !awaitingThrow) { myHand.cancel(); myHand = null; sendShake(false); } });
cv.addEventListener('pointerleave', hideTip);

// ---------- Clickable home dice: pulsing outline, glowing ring underneath, bobbing arrow ----------
// Shown only on the screen that can actually click it, and only while clicking would do something.
let hoveredHome = null;
const arrowTex = (() => {
  const [c, g] = canvas(128);
  g.beginPath(); g.moveTo(24, 30); g.lineTo(104, 30); g.lineTo(64, 104); g.closePath();   // a downward chevron
  g.fillStyle = '#ffc94a'; g.fill(); g.lineWidth = 8; g.strokeStyle = '#3a2208'; g.lineJoin = 'round'; g.stroke();
  return new THREE.CanvasTexture(c);
})();
function addHomeHint(d) {
  // Outline trick: a slightly bigger copy of the die, drawn inside-out (back faces only), so just its rim shows around the die
  const outline = new THREE.Mesh(dieGeo, new THREE.MeshBasicMaterial({ color: '#ffb347', side: THREE.BackSide, transparent: true, depthWrite: false, toneMapped: false }));
  outline.scale.setScalar(1.14);
  d.mesh.add(outline);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.8, 1.0, 48),
    new THREE.MeshBasicMaterial({ color: '#ffb347', transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(d.mesh.position.x, 0.02, d.mesh.position.z);
  const arrow = new THREE.Sprite(new THREE.SpriteMaterial({ map: arrowTex, transparent: true, depthWrite: false, toneMapped: false }));
  arrow.scale.set(0.55, 0.55, 1);
  scene.add(ring, arrow);
  d.hint = { outline, ring, arrow };
}
function removeHomeHint(d) {
  if (!d.hint) return;
  const { outline, ring, arrow } = d.hint;
  d.mesh.remove(outline); outline.material.dispose();
  scene.remove(ring, arrow); ring.geometry.dispose(); ring.material.dispose(); arrow.material.dispose();
  d.mesh.scale.setScalar(1);
  d.mats[d.top].emissiveIntensity = 0.25;   // settle back to a faint glow
  d.hint = null;
}
// Runs every frame: adds/removes hints as the situation changes, and animates the ones showing
function updateHomeHints(t) {
  const on = canSpendHome();
  for (const d of tableDice) {
    const want = on && d.face === 'home' && !d.gone && !d.spent && !d.returned;
    if (want && !d.hint) addHomeHint(d);
    else if (!want && d.hint) removeHomeHint(d);
    if (!d.hint) continue;
    const p = 0.5 + 0.5 * Math.sin(t * 4), hov = d === hoveredHome;   // p pulses 0 → 1 → 0 about every 1.5 s
    d.hint.outline.material.opacity = Math.min(1, 0.35 + p * 0.45 + (hov ? 0.35 : 0));
    d.hint.ring.material.opacity = 0.3 + p * 0.45;
    d.hint.ring.rotation.z = t * 1.5;
    d.hint.ring.scale.setScalar(1 + p * 0.15);
    d.hint.arrow.position.set(d.mesh.position.x, 1.5 + Math.sin(t * 3) * 0.15, d.mesh.position.z);
    d.mats[d.top].emissive.set(FX_COLOR.home);
    d.mats[d.top].emissiveIntensity = 0.5 + p * 0.9;
    d.mesh.scale.setScalar(hov ? 1.1 : 1);   // pops up a little under the cursor
  }
}

// ---------- Hover tooltips ----------
const TIPS = {
  ship: 'Ship: +1 gold at sea',
  shield: `Shield: every ${SHIELDS_PER_STORM} shields block one storm`,
  storm: 'Storm: this die is lost for the turn',
  home: 'Home: spend it to bring your gold home',
  horn: 'Horn: sits out your next throw',
};
// Which die is under the pointer? (table dice that have landed, plus tray dice)
function pickDie() {
  const candidates = [...tableDice.filter(d => !d.gone && d.face), ...trays.horn.dice.map(d => ({ ...d, tray: 'horn' })), ...trays.storm.dice.map(d => ({ ...d, tray: 'storm' }))];
  const hit = raycaster.intersectObjects(candidates.map(d => d.mesh), false)[0];
  return hit && candidates.find(d => d.mesh === hit.object);
}
function hover(e) {
  if (playback) return hideTip();
  const d = pickDie();
  const clickable = d?.face === 'home' && !d.tray && !d.spent && canSpendHome();
  hoveredHome = clickable ? d : null;
  cv.style.cursor = clickable ? 'pointer' : canThrowNow() ? 'grab' : '';
  if (!d) return hideTip();
  const text = d.tray === 'horn' ? 'Resting horn: back after your next throw'
    : d.returned ? 'Back from the mead bench: in play for your next throw'
    : d.tray === 'storm' ? 'Lost to the storm until your turn ends'
    : clickable ? `Home: click to bring ${view.turn.unbanked} gold home`
    : d.blocked ? 'Storm, blocked by your shields'
    : TIPS[d.face];
  const tip = $('tip');
  tip.textContent = text;
  tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`;
  tip.classList.remove('hidden');
}
function hideTip() { $('tip').classList.add('hidden'); hoveredHome = null; }

// ---------- Emotes ----------
const EMOTES = {
  skal:  { icon: '🍺', text: 'Skål!' },
  odin:  { icon: '⚡', text: "Odin's beard!" },
  laugh: { icon: '😂', text: 'Ha ha ha!' },
  groan: { icon: '😩', text: 'Argh…' },
};
$('emotes').innerHTML = Object.entries(EMOTES).map(([k, v]) => `<button data-emote="${k}" title="${v.text}">${v.icon}</button>`).join('');
let lastEmote = 0;
$('emotes').onclick = e => {
  const k = e.target.closest('[data-emote]')?.dataset.emote;
  if (!k || performance.now() - lastEmote < 1200) return;   // light rate limit
  lastEmote = performance.now();
  act('emote', k);
};
const emoteTimes = new Map();   // host: last emote time per sender, to stop spam
function relayEmote(from, k) {
  if (!EMOTES[k] || Date.now() - (emoteTimes.get(from) || 0) < 1000) return;
  emoteTimes.set(from, Date.now());
  // Speak as the player whose turn it is if you control them, otherwise as your first player
  const cur = S.turn && curPlayer(S);
  const p = (cur && cur.owner === from) ? cur : S.players.find(q => q.owner === from);
  const msg = { t: 'emote', k, pid: p?.id, name: p?.name || 'A guest' };
  for (const c of conns.values()) if (c.open) c.send(msg);
  onEmote(msg);
}
function onEmote(m) {
  const em = EMOTES[m.k];
  if (!em) return;
  // Pop the bubble up from the speaker's bank, or the top of the table if they have none
  const i = view?.players?.findIndex(p => p.id === m.pid) ?? -1;
  const s = toScreen(banks[i] ? banks[i].pile.pos.clone().setY(1.6) : new THREE.Vector3(0, 2, -6));
  const el = document.createElement('div');
  el.className = 'bubble';
  el.innerHTML = `<span class="em">${em.icon}</span> ${esc(em.text)}<small>${esc(m.name)}</small>`;
  el.style.left = `${s.x}px`; el.style.top = `${s.y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
  SFX.emote(m.k);
}

// ---------- Volume ----------
let volume = 70, lastVolume = 70;
try { const v = localStorage.getItem('runedice-vol'); if (v !== null) volume = +v; } catch {}
function applyVolume() {
  if (master) master.gain.value = 0.8 * volume / 100;
  $('volBtn').textContent = volume === 0 ? '🔇' : volume < 40 ? '🔉' : '🔊';
  $('volRange').value = volume;
  $('muteBtn').textContent = volume === 0 ? 'Unmute' : 'Mute';
  try { localStorage.setItem('runedice-vol', volume); } catch {}
}
$('volBtn').onclick = () => $('volPop').classList.toggle('hidden');
$('volRange').oninput = e => { volume = +e.target.value; if (volume) lastVolume = volume; audio(); applyVolume(); };
$('muteBtn').onclick = () => { volume = volume ? 0 : (lastVolume || 70); audio(); applyVolume(); };
applyVolume();

// Debug hook for testing in the console (read-only peek at state)
window.runeDice = { get view() { return view; }, get host() { return S; }, get dice() { return tableDice; }, get trays() { return trays; }, get atSea() { return atSea; }, get banks() { return banks; }, get hand() { return myHand; }, get remoteHands() { return remoteHands; }, handStyles: HAND_STYLES, fx: { lightning, shine, glow, vanish } };

// =====================================================================
//  MAIN LOOP
// =====================================================================
// Camera follow: while dice tumble, lean a little toward them and push in slightly; ease back when they settle
const camFocus = new THREE.Vector3(), camGoal = new THREE.Vector3();
let camZoom = 0;
function updateCamera(dt) {
  let zoomGoal = 0;
  camGoal.set(0, 0, 0);
  if (playback && tableDice.length) {
    for (const d of tableDice) camGoal.add(d.mesh.position);
    camGoal.divideScalar(tableDice.length).setY(0).multiplyScalar(0.3);   // 30% of the way toward the dice
    zoomGoal = 0.14;
  }
  const k = 1 - Math.exp(-dt * 2.5);   // smooth, frame-rate independent easing
  camFocus.lerp(camGoal, k);
  camZoom += (zoomGoal - camZoom) * k;
  const target = camBase.target.clone().add(camFocus);
  camera.position.copy(camBase.pos).sub(camBase.target).multiplyScalar(1 - camZoom).add(target);
  camera.lookAt(target);
}

const clock = new THREE.Clock();
let lastFrame = performance.now();
function frame() {
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 0.05); lastFrame = now;
  const t = clock.getElapsedTime();
  torch.intensity = 55 + Math.sin(t * 7.3) * 6 + Math.sin(t * 13.1) * 4 + Math.random() * 5; // layered sines + noise = flicker
  if (playback) updatePlayback(now);
  myHand?.update(dt, now);
  remoteHands.forEach(h => h.update(dt, now));
  updateCamera(dt);
  try { updateHomeHints(t); } catch (e) { console.error(e); }
  for (let i = effects.length - 1; i >= 0; i--) if (effects[i](now) === false) effects.splice(i, 1);
  renderer.render(scene, camera);
  try { updateLabels(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
frame();
</script>
